services:
  provider:
    image: ${PROVIDER_IMAGE:-gitea.teamlead.one/armanteam_public/mail-provider:1}
    environment:
      CANDIDATE: ${CANDIDATE:?укажите CANDIDATE в файле .env}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/v1/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: mail
      POSTGRES_DB: mail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail"]
      interval: 3s
      retries: 10

  worker:
    build: .
    command: sh -c "pnpm run db:migrate && pnpm run worker"
    depends_on:
      provider:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mail:mail@postgres:5432/mail
      PROVIDER_URL: http://provider:8080

  exporter:
    build: .
    command: pnpm run exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mail:mail@postgres:5432/mail
    volumes:
      - ./out:/app/out

volumes:
  pgdata:
